function show(id){scr=id;P.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));P.classList.toggle('dark',['ph2','kk','st'].includes(id))}
function tick(){const d=new Date(),h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');const a=$('lt');if(a){a.textContent=h+':'+m;$('ld').textContent=d.toLocaleDateString(lang=='ko'?'ko-KR':'zh-CN',{month:'long',day:'numeric',weekday:'long'});$('sbt').textContent=h+':'+m}}
setInterval(tick,10000);
const home=()=>{endCall();cur=null;show('home')};
/* ---- AI chat ---- */
const pop=k=>{$('alt').textContent=t(k);$('al').classList.add('on')};
const gk=()=>{let k='';try{k=localStorage.getItem('gk')||''}catch(e){}return k||C.ai.apiKey||''};
async function ai(f){
 const key=gk();if(!key)return{err:'nokey'};
 const c=[];H[f.id].forEach(x=>{const r=x.me?'user':'model',tx=L(x.text);if(c.length&&c[c.length-1].role==r)c[c.length-1].parts[0].text+='\n'+tx;else c.push({role:r,parts:[{text:tx}]})});
 while(c.length&&c[0].role!='user')c.shift();
 const sys=`你是${f.name}，正在KakaoTalk上和「${C.userName}」聊天。你们是彼此有好感、关系正在发展的状态。不要编造你们共同的过去事件、具体日期，也不要编造她的年龄、职业、外貌、家人等她没说过的信息；不知道的事就顺着她说的话聊，或自然地问她。
你的人设：${f.persona.replaceAll('{u}',C.userName)}
规则：必须直接、具体地回应她刚说的那句话（接住情绪和细节，不说无关套话，不重复自己说过的话）；始终保持角色，不提AI或设定；像真实韩国男生发KakaoTalk，每次1到3条短消息，每条一行用换行分隔；不要括号动作描写；可适度用表情和ㅋㅋ；回复语言：${lang=='ko'?'韩语（自然的口语半语）':'简体中文'}。`;
 let err='busy';
 for(const m of C.ai.models){
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:c,generationConfig:{maxOutputTokens:1024,temperature:1}})});
   if(r.status==429)return{err:'busy'};
   if(r.status==400||r.status==403){const j=await r.text();if(/API key|API_KEY|PERMISSION/i.test(j))return{err:'nokey'};continue}
   if(!r.ok)continue;
   const j=await r.json(),tx=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
   if(tx)return{text:tx}}catch(e){}
 }
 return{err}
}
function renderChat(){const f=C.friends[cur];if(!f)return;const h=H[cur],lm=h.map(m=>m.me).lastIndexOf(1),lh=h.map(m=>m.me).lastIndexOf(0);
 $('kb').innerHTML=h.map((m,i)=>m.me?`<div class="bb"><s>${i==lm&&lm>lh?'<b>1</b>':''}${L(m.time)}</s><p>${esc(L(m.text))}</p></div>`:`<div class="bl">${av(f)}<div><small>${f.name}</small><div class="rw"><p>${esc(L(m.text))}</p><s>${L(m.time)}</s></div></div></div>`).join('')+(typing==cur?`<div class="bl">${av(f)}<div><div class="rw"><p class="ty">• • •</p></div></div></div>`:'');
 $('kb').scrollTop=1e6}
async function send(){const v=$('kin').value.trim();if(!v||busy||cur==null)return;const id=cur,f=C.friends[id];
 H[id].push({me:1,text:v,time:nowT()});$('kin').value='';renderChat();busy=1;await sleep(700);typing=id;cur==id&&renderChat();
 const r=await ai(f),ps=r.text?r.text.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,3):[];
 if(!ps.length){typing=null;busy=0;cur==id&&renderChat();pop(r.err||'busy');return}
 for(let i=0;i<ps.length;i++){await sleep(400+ps[i].length*35);H[id].push({me:0,text:ps[i],time:nowT()});typing=i<ps.length-1?id:null;cur==id&&renderChat()}
 typing=null;busy=0}
/* ---- instagram call ---- */
function startCall(){show('ig');$('inc').style.display='block';$('vc').style.display='none'}
function endCall(){tms.forEach(clearTimeout);tms=[];clearInterval(iv);const a=$('v1');if(a){a.pause();$('v2').pause();$('cf').innerHTML='';$('vin').value=''}}
function addMsg(n,s){const cf=$('cf'),d=document.createElement('div');d.innerHTML='<b></b><span></span>';d.firstChild.textContent=n;d.lastChild.textContent=s;cf.appendChild(d);while(cf.children.length>5)cf.firstChild.remove();setTimeout(()=>d.style.opacity=0,6000);setTimeout(()=>d.remove(),6900)}
/* ---- spotify state ---- */
const SL=S.songs,au=new Audio();let ix=-1,pl=false,tt=0,shf=false,rep=false;
const dur=()=>(SL[ix].audio&&isFinite(au.duration)?au.duration:SL[ix].dur)||180;
function play(i){ix=i;const s=SL[i];tt=0;if(s.audio){au.src=s.audio;au.play().catch(()=>{})}else au.removeAttribute('src');pl=true;ui()}
function ui(){document.querySelectorAll('.sr').forEach((r,i)=>{r.classList.toggle('g',i==ix);r.classList.toggle('paused',!pl);const b=r.querySelector('b');b.querySelector('.eq')?.remove();if(i==ix)b.insertAdjacentHTML('afterbegin','<span class="eq"><i></i><i></i><i></i></span>')});
 if(ix<0)return;const s=SL[ix];$('mini').style.display='flex';$('mt').textContent=$('ft').textContent=s.title;$('ma').textContent=$('fa').textContent=s.artist;
 const c=pl?'❚❚':'▶';$('mb').textContent=$('fb').textContent=c;$('pl').textContent=c;prog()}
function prog(){if(ix<0)return;const d=dur();$('mp').style.width=tt/d*100+'%';$('sk').value=tt/d*100;$('t1').textContent=fmt(tt);$('t2').textContent=fmt(d)}
function nxt(a){const n=SL.length;if(shf&&n>1){let r;do{r=Math.floor(Math.random()*n)}while(r==ix);play(r)}else play((ix+(a||1)+n)%n)}
setInterval(()=>{if(ix<0||!pl)return;if(SL[ix].audio&&au.src)tt=au.currentTime;else tt+=.25;if(tt>=dur()-.1){rep?play(ix):nxt()}prog()},250);
au.onended=()=>rep?play(ix):nxt();
/* ---- wiring ---- */
function bind(){
 const lk=$('lock');let y0=null;
 lk.onpointerdown=e=>y0=e.clientY;lk.onpointermove=e=>{if(y0!=null&&e.clientY-y0<-70){y0=null;show('home')}};lk.onpointerup=()=>y0=null;
 lk.querySelector('.hb').onclick=()=>show('home');
 P.querySelectorAll('.hb').forEach(h=>{if(!h.closest('#lock'))h.onclick=home});
 P.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{const o=el.dataset.o;if(o)o=='ig'?startCall():show(o)});
 /* kakao */
 $('me').onclick=()=>$('kp').classList.add('on');$('kx').onclick=()=>$('kp').classList.remove('on');
 document.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{cur=+r.dataset.f;const f=C.friends[cur];$('kav').innerHTML=av(f);$('knm').textContent=f.name;renderChat();$('kc').classList.add('on')});
 $('kb2').onclick=()=>{$('kc').classList.remove('on');cur=null};
 $('ks').onclick=send;$('kin').onkeydown=e=>e.key=='Enter'&&send();
 /* instagram */
 const v1=$('v1'),v2=$('v2');
 $('dec').onclick=$('b4').onclick=home;
 $('acc').onclick=()=>{$('inc').style.display='none';$('vc').style.display='block';v1.src=I.video;v2.src=I.selfVideo||'';v1.muted=true;v1.play().catch(()=>{});v2.play().catch(()=>{});
  sec=0;$('tm').textContent='00:00';iv=setInterval(()=>{sec++;$('tm').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);
  let at=0;I.messages.forEach(m=>{at+=(m.delay||3)*1000;tms.push(setTimeout(()=>addMsg(m.from=='我'?C.userName:C.contactName,L(m.text)),at))})};
 v1.onclick=()=>{v1.muted=false;v1.play().catch(()=>{})};
 $('vin').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){addMsg(C.userName,e.target.value.trim());e.target.value=''}};
 $('b1').onclick=()=>{v2.style.transform=v2.style.transform?'':'scaleX(-1)'};
 $('b2').onclick=e=>{e.target.classList.toggle('off');v2.muted=!v2.muted};
 $('b3').onclick=e=>{e.target.classList.toggle('off');$('pip').style.visibility=e.target.classList.contains('off')?'hidden':'visible'};
 const pip=$('pip');let dg=null;
 pip.onpointerdown=e=>{const r=pip.getBoundingClientRect();dg=[e.clientX-r.left,e.clientY-r.top];pip.setPointerCapture(e.pointerId)};
 pip.onpointermove=e=>{if(!dg)return;const b=P.getBoundingClientRect();pip.style.left=Math.min(b.width-100,Math.max(0,e.clientX-b.left-dg[0]))+'px';pip.style.top=Math.min(b.height-150,Math.max(0,e.clientY-b.top-dg[1]))+'px';pip.style.right='auto'};
 pip.onpointerup=()=>dg=null;
 /* spotify */
 if(S.cover)document.querySelectorAll('.th').forEach(x=>x.style.backgroundImage=`url("${S.cover}")`);
 document.querySelectorAll('.sr').forEach(r=>r.onclick=()=>play(+r.dataset.i));
 const tog=e=>{e&&e.stopPropagation();if(ix<0)return play(0);pl=!pl;if(SL[ix].audio){pl?au.play():au.pause()}ui()};
 $('pl').onclick=tog;$('mb').onclick=tog;$('fb').onclick=tog;
 $('mini').onclick=()=>$('fp').classList.add('on');$('fx').onclick=()=>$('fp').classList.remove('on');
 $('nx').onclick=()=>nxt();$('pv').onclick=()=>tt>3?play(ix):nxt(-1);
 $('sh').onclick=e=>{shf=!shf;e.target.classList.toggle('on',shf)};$('rp').onclick=e=>{rep=!rep;e.target.classList.toggle('on',rep)};
 $('sk').oninput=e=>{tt=e.target.value/100*dur();if(SL[ix].audio)au.currentTime=tt;prog()};
 $('alb').onclick=()=>$('al').classList.remove('on');
 $('ak').onclick=()=>{$('kin2').value=gk();$('stk').classList.add('on')};$('skb').onclick=()=>$('stk').classList.remove('on');
 $('ksv').onclick=()=>{try{localStorage.setItem('gk',$('kin2').value.trim())}catch(e){}$('ksv').textContent=t('svd');setTimeout(()=>{const b=$('ksv');if(b)b.textContent=t('sv')},1200)};
 /* settings: language */
 $('lr').onclick=()=>$('stl').classList.add('on');$('stb').onclick=()=>$('stl').classList.remove('on');
 document.querySelectorAll('[data-l]').forEach(r=>r.onclick=()=>{lang=r.dataset.l;try{localStorage.setItem('lg',lang)}catch(e){}scr='st';build();$('stl').classList.add('on')});
}
